name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # clj-kondo + cljfmt for `make test-lint`
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          clj-kondo: latest
          cljfmt: latest

      - run: npm ci

      # Browser binary + system deps for the Playwright e2e suite.
      - run: npx playwright install --with-deps chromium

      - run: make test-all
