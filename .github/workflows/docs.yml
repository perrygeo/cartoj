name: Docs

on:
  push:
    branches: [main, mp/demo-improvements]  # TODO: drop the feature branch before merging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - run: npm ci

      - run: npx shadow-cljs release dev

      - run: make docs

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
